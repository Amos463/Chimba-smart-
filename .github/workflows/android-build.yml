name: Android testing builds

on:
  push:
    paths:
      - "ChimbaSmart_v0.5.0-rc1/mobile/**"
      - "ChimbaSmart_v0.5.0-rc1/frontend/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "ChimbaSmart_v0.5.0-rc1/mobile/**"
      - "ChimbaSmart_v0.5.0-rc1/frontend/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/android/**/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/package-lock.json
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install pinned Capacitor dependencies
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor
        run: npm ci
      - name: Stage PWA and synchronize Android shell
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor
        run: npm run cap:sync
      - name: Build debug and testing-signed release artifacts
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Verify and hash artifacts
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p testing-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk testing-artifacts/chimbasmart-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk testing-artifacts/chimbasmart-testing-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab testing-artifacts/chimbasmart-testing-signed.aab
          (cd testing-artifacts && sha256sum chimbasmart-debug.apk chimbasmart-testing-signed.apk chimbasmart-testing-signed.aab > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: chimbasmart-capacitor-testing-signed-${{ github.run_number }}
          path: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/testing-artifacts/
          retention-days: 14
          if-no-files-found: error
