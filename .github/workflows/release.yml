name: ChimbaSmart Testing Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: chimbasmart-testing-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/package-lock.json

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f5ef7065407
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Capacitor dependencies
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor
        run: npm ci

      - name: Synchronize Android project
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor
        run: npm run cap:sync

      - name: Build testing APK and AAB
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Collect testing artifacts
        working-directory: ChimbaSmart_v0.5.0-rc1/mobile/capacitor
        run: |
          set -eu
          mkdir -p release-artifacts
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/chimbasmart-testing-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/chimbasmart-testing-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-artifacts/chimbasmart-testing-release.aab
          cd release-artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chimbasmart-testing-${{ github.run_number }}
          path: ChimbaSmart_v0.5.0-rc1/mobile/capacitor/release-artifacts/
          retention-days: 14
          if-no-files-found: error
