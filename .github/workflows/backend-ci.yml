name: Backend CI

on:
  push:
    paths:
      - "ChimbaSmart_v0.5.0-rc1/backend/**"
      - "ChimbaSmart_v0.5.0-rc1/frontend/**"
      - "ChimbaSmart_v0.5.0-rc1/scripts/**"
      - "ChimbaSmart_v0.5.0-rc1/docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "ChimbaSmart_v0.5.0-rc1/backend/**"
      - "ChimbaSmart_v0.5.0-rc1/frontend/**"
      - "ChimbaSmart_v0.5.0-rc1/scripts/**"
      - "ChimbaSmart_v0.5.0-rc1/docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: chimbasmart_test
          POSTGRES_USER: chimba
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chimba -d chimbasmart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://chimba:test-only-password@localhost:5432/chimbasmart_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-only-secret-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ChimbaSmart_v0.5.0-rc1/backend/requirements.txt pip-audit
      - name: Python syntax
        run: python -m compileall -q ChimbaSmart_v0.5.0-rc1/backend/app ChimbaSmart_v0.5.0-rc1/backend/migrations ChimbaSmart_v0.5.0-rc1/backend/tests
      - name: Backend, Redis and PostGIS integration tests
        working-directory: ChimbaSmart_v0.5.0-rc1/backend
        run: python -m pytest -q
      - name: Fresh SQLite migration and metadata check
        working-directory: ChimbaSmart_v0.5.0-rc1/backend
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
          AUTO_CREATE_TABLES: "0"
        run: |
          alembic upgrade head
          alembic check
      - name: Frontend JavaScript syntax
        run: |
          node --check ChimbaSmart_v0.5.0-rc1/frontend/app.js
          node --check ChimbaSmart_v0.5.0-rc1/frontend/sw.js
      - name: Dependency vulnerability audit
        run: pip-audit -r ChimbaSmart_v0.5.0-rc1/backend/requirements.txt
