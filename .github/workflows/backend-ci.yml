name: Backend CI

on:
  push:
    paths:
      - "ChimbaSmart_v0.5.0-rc1/backend/**"
      - "ChimbaSmart_v0.5.0-rc1/frontend/**"
      - "ChimbaSmart_v0.5.0-rc1/scripts/**"
      - "ChimbaSmart_v0.5.0-rc1/docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "ChimbaSmart_v0.5.0-rc1/backend/**"
      - "ChimbaSmart_v0.5.0-rc1/frontend/**"
      - "ChimbaSmart_v0.5.0-rc1/scripts/**"
      - "ChimbaSmart_v0.5.0-rc1/docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: chimbasmart_test
          POSTGRES_USER: chimba
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chimba -d chimbasmart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://chimba:test-only-password@localhost:5432/chimbasmart_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-only-secret-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ChimbaSmart_v0.5.0-rc1/backend/requirements.txt pip-audit
      - name: Python syntax
        run: python -m compileall -q ChimbaSmart_v0.5.0-rc1/backend/app ChimbaSmart_v0.5.0-rc1/backend/migrations ChimbaSmart_v0.5.0-rc1/backend/tests
      - name: Backend, Redis and PostGIS integration tests
        working-directory: ChimbaSmart_v0.5.0-rc1/backend
        run: python -m pytest -q
      - name: Fresh SQLite migration and metadata check
        working-directory: ChimbaSmart_v0.5.0-rc1/backend
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
          AUTO_CREATE_TABLES: "0"
        run: |
          alembic upgrade head
          alembic check
      - name: Upgrade from 0008 preserves existing user
        working-directory: ChimbaSmart_v0.5.0-rc1/backend
        run: |
          export DATABASE_URL=sqlite:////tmp/chimbasmart-upgrade-test.db
          export AUTO_CREATE_TABLES=0
          alembic upgrade 0008_auth_version
          python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('/tmp/chimbasmart-upgrade-test.db')
          connection.execute(
              "INSERT INTO users (id, username, password_hash, role, auth_version) VALUES (?, ?, ?, ?, ?)",
              ('test-only-user-id', 'test-only-upgrade-user', 'test-only-hash', 'field_user', 0),
          )
          connection.commit()
          connection.close()
          PY
          alembic upgrade head
          python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('/tmp/chimbasmart-upgrade-test.db')
          assert connection.execute(
              "SELECT username FROM users WHERE id='test-only-user-id'"
          ).fetchone() == ('test-only-upgrade-user',)
          assert connection.execute(
              "SELECT name FROM sqlite_master WHERE type='table' AND name='qa_waivers'"
          ).fetchone() == ('qa_waivers',)
          connection.close()
          PY
      - name: Frontend JavaScript syntax
        run: |
          node --check ChimbaSmart_v0.5.0-rc1/frontend/app.js
          node --check ChimbaSmart_v0.5.0-rc1/frontend/field-workflows.js
          node --check ChimbaSmart_v0.5.0-rc1/frontend/sw.js
      - name: Dependency vulnerability audit
        run: pip-audit -r ChimbaSmart_v0.5.0-rc1/backend/requirements.txt
  pwa-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/chimbasmart-pwa-e2e.db
      ATTACHMENTS_DIR: /tmp/chimbasmart-pwa-e2e-attachments
      JWT_SECRET: test-only-pwa-e2e-secret-not-for-production-123456
      E2E_USER: juma
      E2E_PASSWORD: test-only-pwa-password-123
      PWA_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ChimbaSmart_v0.5.0-rc1/backend/requirements.txt
          mkdir -p "$RUNNER_TEMP/chimba-playwright"
          cd "$RUNNER_TEMP/chimba-playwright"
          npm init -y
          npm install --save-exact @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run PWA offline and synchronization acceptance
        run: |
          set -eu
          mkdir -p "$ATTACHMENTS_DIR"
          cd ChimbaSmart_v0.5.0-rc1/backend
          python -m app.cli create-user "$E2E_USER" "$E2E_PASSWORD" --role admin
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/pwa-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; wait "$api_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "$PWA_BASE_URL/ready" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$PWA_BASE_URL/ready"
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/chimba-playwright/node_modules" \
            "$RUNNER_TEMP/chimba-playwright/node_modules/.bin/playwright" \
            test ChimbaSmart_v0.5.0-rc1/frontend/e2e/pwa.spec.cjs --workers=1 --reporter=list
