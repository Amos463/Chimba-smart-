name: Engine CI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    paths:
      - "backend/app/engines/**"
      - "backend/requirements*.txt"
      - "backend/Dockerfile.engines"
      - "backend/tests/test_optional_engines.py"
      - "docker-compose.yml"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "backend/app/engines/**"
      - "backend/requirements*.txt"
      - "backend/Dockerfile.engines"
      - "backend/tests/test_optional_engines.py"
      - "docker-compose.yml"
      - ".github/workflows/engine-ci.yml"

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated scientific adapter environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-open-source-engines.txt
      - name: Synthetic engine runtime tests
        working-directory: backend
        run: python -m pytest -q tests/test_optional_engines.py
      - name: Engine registry status
        working-directory: backend
        run: |
          python - <<'PY'
          from app.engines import ENGINES
          for name, engine in ENGINES.items():
              print(f"{name}: adapter_ready={engine.adapter_ready}, library_installed={engine.library_installed}, version={engine.version}")
          assert all(ENGINES[name].adapter_ready for name in ("gempy", "loopstructural", "pygimli"))
          assert not ENGINES["pygslib"].library_installed
          PY
      - name: Build isolated engine worker image
        run: docker build --file backend/Dockerfile.engines --tag chimbasmart-engine-worker:ci .
