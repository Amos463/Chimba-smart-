name: Android testing builds

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
      - name: Resolve Dart packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Build release APK testing artifact
        working-directory: mobile
        run: flutter build apk --release
      - name: Build release AAB testing artifact
        working-directory: mobile
        run: flutter build appbundle --release
      - name: Verify and hash artifacts
        working-directory: mobile
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: chimbasmart-android-testing-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
