name: Approved commercial release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after all gates pass and environment approval"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: commercial-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: chimbasmart_test
          POSTGRES_USER: chimba
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chimba -d chimbasmart_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://chimba:test-only-password@localhost:5432/chimbasmart_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: release-test-only-secret-not-production-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
      - name: Backend release gates
        run: |
          python -m pip install -r backend/requirements.txt
          python -m compileall -q backend/app backend/migrations backend/tests
          (cd backend && python -m pytest -q)
      - name: Flutter release gates
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Confirm owner release gates
        env:
          RELEASE_GATES_APPROVED: ${{ vars.COMMERCIAL_RELEASE_GATES_PASSED }}
        run: |
          test "$RELEASE_GATES_APPROVED" = "true" || {
            echo "Commercial release is blocked: owner must set COMMERCIAL_RELEASE_GATES_PASSED=true after reviewing outstanding release criteria."
            exit 1
          }

  build-and-publish:
    needs: gates
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: commercial-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
      - name: Require owner signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD" || {
            echo "Production Android signing secrets are required; no debug-signed release will be published."
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/chimbasmart-release.jks"
          chmod 600 "$RUNNER_TEMP/chimbasmart-release.jks"
      - name: Build signed release APK and AAB
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chimbasmart-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          sha256sum build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            > build/release-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chimbasmart-production-${{ github.ref_name }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/release-checksums.sha256
          generate_release_notes: true
